name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" AyByay.apk
            echo "Found and copied APK from $APK_FILE to AyByay.apk"
          else
            echo "Error: APK not found"
            find android/ -name "*.apk" || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyByay-APK
          path: AyByay.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ay Byay App v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: AyByay.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
